[package]
name = "syncblaze-desktop"
version = "0.1.2"
description = "SyncBlaze desktop companion — local network pairing for offline file transfer"
edition = "2021"

[lib]
name = "syncblaze_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
futures-util = "0.3"
local-ip-address = "0.6"
nanoid = "0.4"
# Google sign-in (PKCE, system-browser flow — see src/oauth.rs)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
