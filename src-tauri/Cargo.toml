[package]
name = "syncblaze-desktop"
version = "0.1.1"
description = "SyncBlaze desktop companion — local network pairing for offline file transfer"
edition = "2021"

[lib]
name = "syncblaze_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
futures-util = "0.3"
local-ip-address = "0.6"
nanoid = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
